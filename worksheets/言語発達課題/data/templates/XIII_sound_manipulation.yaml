# ⅩⅢ おとけし・ぎゃくよみ（音韻意識：音の削除・逆唱）
# 1問＝4つ（entries）。op: ぎゃく（さかさまに言う）／けす（t の音をとる）。こたえは自動で作り、マスの数で示す。
# こたえは、別の意味のある言葉になるようにする（2026-10-26 確認による変更。answer と一致するか生成時に検査）。
# level（原 2001・2012 の通過年齢の目安：逆唱 2音 5歳後半・3音 6歳前半、削除 2〜3音 6歳前半・4〜6音 6歳後半。Wiki PA-06）:
#   1 = 2音のことばを ぎゃくから言う
#   2 = 3音のことばを ぎゃくから言う／はじめ・おしまいの音をとる
#   3 = 3〜4音のことばの まんなかの音をとる
# けす音は、そのことばに1回だけ出てくる音にする（生成時に検査）。
# disp: 表示の形（漢字《よみ》）。意味が分かれて辞書で漢字にしない語を、この問題では漢字で示したいときに書く。
