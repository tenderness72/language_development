# ⅩⅢ おとけし・ぎゃくよみ（音韻意識：音の削除・逆唱）
# 1問＝4つ（entries）。op: ぎゃく（さかさまに言う）／けす（t の音をとる）。こたえは自動で作り、マスの数で示す。
# level（原 2001・2012 の通過年齢の目安：逆唱 2音 5歳後半・3音 6歳前半・4音 7歳前半、削除 2〜3音 6歳前半・4〜6音 6歳後半。Wiki PA-06）:
#   1 = 2音のことばを ぎゃくから言う（清音）
#   2 = 3音のことばを ぎゃくから言う／はじめ・おしまいの音をけす（濁音を含む）
#   3 = 4〜5音のことばを ぎゃくから言う／まんなかの音をけす
# けす音は、そのことばに1回だけ出てくる音にする（生成時に検査）。特殊音節の語は使わない。
