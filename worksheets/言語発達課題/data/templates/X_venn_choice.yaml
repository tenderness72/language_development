# Ⅹ ベン図えらび（Ⅷ 属性交差の「書かない版」・正解あり）
# left_attr / right_attr: 左右の円の条件
# left: 左だけに合う語 / both: 両方に合う語 / right: 右だけに合う語（各2語）
# none: どちらにも合わない語（2語。Lv2 のみ。円の外の四角に結ぶ）
# 書かずに線で答える。2つの条件を同時に見ること・「だけ」（除外）の理解を、書字と切り離して見られる。
# level: 1=3つの場所（左だけ・両方・右だけ） 2=どちらでもない を加えた4つの場所
# どの語も、どの場所に入るかが1つに決まる組にすること（色・形・場所など、ものによって変わる条件は避ける）。
