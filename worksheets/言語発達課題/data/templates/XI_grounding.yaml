# Ⅺ 経験とむすぼう（記号接地の段・自由記述）
# ことばを、自分の経験・感覚・動作と結びつける。文字の語どうしの結びつきだけで終わらせないための段。
# 根拠（Wiki）：記号接地問題（WL-10、Harnad 1990）、オノマトペを接地の足場とみる立場（WL-11、今井・秋田 2023：二次）、
#   自分で操作する・ジェスチャーをする経験が語の学習・般化を助ける（WL-13）、心像性の高い語ほど早く獲得される（WL-14）、
