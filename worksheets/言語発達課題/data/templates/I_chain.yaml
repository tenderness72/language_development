# Ⅰ 連想チェーン
# chain: [start, 列2, 列3, 列4, goal]（連想で1本につながる正解列）
#   形は「名詞 → 動き → 名詞 → 動き → 名詞」にそろえる（例: 雨 → ふる → みずたまり → ふむ → ながぐつ）。
#   「つくる」「使う」のように何にでもつながる動詞は使わない。
# distractors: 各列(col2/col3/col4)のダミー語3つ。正解語と同じ品詞にし、正解語と重複させないこと。
# level（ダミー語の近さで段階化）:
#   1 = 遠いダミー（始まりとも終わりとも関係のない語）
#   2 = 中くらい（同じ場面にはあるが、つながらない語）
#   3 = 近いダミー（途中までは筋が通る「わき道」になるが、ゴールには届かない語）
# ダミーを通っても start→goal が意味の上でつながってしまわないか（正解以外の経路がないか）を
# 人が確認すること（自動では検査できない）。
type: I
items:
  # ---- Lv1：遠いダミー ----
  - id: rain_boots
    chain: [雨, ふる, みずたまり, ふむ, ながぐつ]
    distractors:
      col2: [はしる, わらう, ねむる]
      col3: [バナナ, とけい, ボール]
      col4: [たべる, およぐ, うたう]
    level: 1
