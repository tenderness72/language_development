# Ⅴ つづき歌（自由記述）
# start: 開始語 / example: 2番目の欄に薄い字で入れる手本の語 / slots: 空欄の数（既定5。手本の欄を含む）
# relation: 前のことばとのつなぎ方。矢印の横に表示する。
#   いっしょ … いっしょにあるもの・いっしょに使うもの（主題的な関係）
#   なかま   … おなじなかまのもの（分類学的な関係）
#   こうたい … 「なかま」と「いっしょ」を1つずつ交互に（最初の矢印は なかま）
# level は relation で決める（2026-10-23 改訂）：1=いっしょ 2=なかま 3=こうたい
#   根拠：幼児が主題的関係と分類学的関係のどちらを選ぶかは教示で変わる（湯川, 2002）。
#   上位概念の知識は3〜4歳、関係を切り替える実行制御は4〜5歳で伸びる（Blaye & Jacques, 2009）。
#   Wiki の SV-08・SV-09 を参照。
# example は relation の最初の矢印に合う語にすること（こうたい は なかま の語）。
type: V
