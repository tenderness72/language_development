# Ⅻ おとさがし（音韻意識：音の抽出・同定）
# target の音が、決められた場所（position）にあることばを○でかこむ。1問＝6語（当たり3語・はずれ3語）。
# position: はじめ（語頭）／おしまい（語尾）／どこか（語のどこか）。当たりは split_mora で自動判定する（生成時に検査）。
# level（語頭音の抽出 → 語尾音の抽出 → 語中を含む同定の順：天野 1970、高橋 1997、原 2012。Wiki PA-01・PA-02）:
#   1 = はじめの音。清音だけ（はずれには、target が語の中やおしまいにある語を入れる）
#   2 = おしまいの音。はずれに濁音のちがい（こ／ご、き／ぎ 等）を入れ、清音と濁音を聞き分ける
#   3 = どこかにある音。はずれに濁音・半濁音のちがい（か／が、ぱ／ば 等）を入れる。特殊音節の語も使う
type: XII
