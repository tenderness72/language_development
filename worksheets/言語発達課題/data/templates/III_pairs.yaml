# Ⅲ ペア対応づけ
# relation: 関係の種類（例: 職業→道具, 動物→鳴き声）
# pairs: [左, 右] を5組。左右それぞれ重複させないこと（一意に解ける）。
# 意味の上でも1対1になるよう確認すること（例: ピアノ・ギターはどちらも「ひく」）。
# 右の語が「こ＋左の語」のように音の規則だけで解ける組は避ける。
type: III
