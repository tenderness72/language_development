# ⅩⅥ じょしをいれよう（格助詞「が」「を」。Lv4 で「に」を加える）
# 文の□に「が」か「を」を入れる。1問＝4文（ページごとに順を入れかえて出す）。parts: 語と、（が）（を）のように括弧で書いた助詞の空欄。
# context: 状況の説明（Lv3。だれがしているかを先に読ませる：先行文脈で「を」の理解が上がる 鈴木 2007。Wiki GR-34）
#   「Aは〜している。Bは〜している。」の短い能動文で書く（「〜しているのはA」の分裂文や受け身は、目標の文より読むのが難しいので使わない。
#   2026-11-05 改訂。改善記録 §12）。説明の中に、答えになる「が」「を」は書かない。
# level（知的障害のある中高生の格助詞挿入課題：非可逆・基本語順は正答80%以上、可逆・非基本語順は40%未満 村尾 2022。Wiki GR-35）:
#   1 = 助詞1つ（とり（が）とぶ／りんご（を）たべる）
#   2 = 「が」「を」の2つ。非可逆（意味で決まる：おかあさん（が）りんご（を）きる）。各問に1文、語順を入れかえた非可逆文
#       （さかな（を）ねこ（が）たべる）を入れる。「はじめが が」の並びだけで解けないようにするため。非可逆・非基本語順文も
#       知的障害のある中高生で正答80%以上だった（村尾 2022：GR-35）。改善記録 §11
#   3 = 可逆文（どちらがしてもおかしくない）。状況の説明を読んでから入れる。語順を入れかえた文（ねこ（を）いぬ（が）おいかける）を含む
#   4 = 「に」を加える（が＋に／が＋に＋を）。非可逆。〈S-S法〉の課題に「に」があることに合わせた追加（改善記録 §3）。
#       同じ名詞で「に」と「を」が入れかわる組（いす（に）すわる／いす（を）はこぶ）と、「を」が「に」より前の文を入れ、
#       助詞の並びだけでは解けないようにする（改善記録 §11）。
#       「に」の習得が「が」「を」より後という根拠は確認できていない。Lv4 は「選ぶ助詞が3つに増える」という課題の負荷の順で置いた。
#       Lv2 のあとなら Lv3 と Lv4 はどちらからでもよい。
# 「が」「を」が書けていても語順で当てている場合があるので、Lv3 の可逆文・入れかえた文で確かめる。
