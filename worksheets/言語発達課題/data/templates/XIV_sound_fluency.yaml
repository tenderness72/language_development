# ⅩⅣ 音から言葉を集めよう（音を手がかりにした語の想起・自由回答）
# 「『か』から始まる言葉」「『こ』で終わる言葉」を、思いつくだけ書く。1問＝1つの音。例（example）を1つ書いておく。
# 答えは1つに決まらないので解答面は作らない。
# level（頭音での想起語数はその音で始まる語の多さに強く左右される：国立国語研究所 1981、Wiki SV-27。
#        Lv3 の「終わる言葉」を後に置くのは、しりとりに語尾音の抽出が必要なこと（高橋 1997：PA-02）からの推論で、
#        語頭と語尾の想起を直接比べた研究はない：2026-11-05 注記。語頭音による想起と探し方は思春期まで伸びる：SV-28）:
#   1 = 語の多い音で始まる言葉（教育基本語彙の低学年配当で、その音から始まる語がおおむね190語以上）
#   2 = 語の少ない音・濁音・半濁音で始まる言葉
#   3 = 「〇で終わる言葉」（語尾音）
# position: はじめ／おしまい。example は、その条件に合う語にする（生成時に検査）。
# 「い」「う」で終わる語は、のばす音（とけい＝とけー）と区別しにくいので、例には長音でない語を使う。
type: XIV
items:
  # ---- Lv1：語の多い音で始まる（2026-10-26 追加・第12〜17回で確認済み） ----
  - {id: f1a, target: か, position: はじめ, example: かさ, level: 1}
  - {id: f1b, target: お, position: はじめ, example: おにぎり, level: 1}
  - {id: f1c, target: あ, position: はじめ, example: あめ, level: 1}
  - {id: f1d, target: は, position: はじめ, example: はさみ, level: 1}
  - {id: f1e, target: こ, position: はじめ, example: こま, level: 1}
  - {id: f1f, target: ま, position: はじめ, example: まど, level: 1}
  - {id: f1g, target: い, position: はじめ, example: いぬ, level: 1}
  - {id: f1h, target: と, position: はじめ, example: とり, level: 1}
  # ---- Lv2：語の少ない音・濁音・半濁音で始まる（2026-10-26 追加・第12〜17回で確認済み） ----
