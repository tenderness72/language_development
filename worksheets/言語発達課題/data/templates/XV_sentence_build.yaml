# ⅩⅤ ぶんをつくろう（二語文・三語文：語をならべる）
# 上の「ことばばこ」の語を、役割の枠（だれが・なにを・どうする・どこで・なにで）に入れて文をつくる。1問＝3文。
# 枠の形（Shape Coding をモノクロにしたもの：Ebbels 2007。Wiki GR-36）：だれが＝楕円、なにを＝四角、どうする＝六角形、
#   どこで・なにで＝破線の角丸（なくても文になる項は破線）。枠の上に疑問語のラベルを出す（Colourful Semantics：GR-37）。
# sentences: 1文＝[[役割, 語], …]（文の順）。役割は だれが／なにが／なにを／どうする／どこで／なにで（もの・自然が主語なら なにが）。
# level（2語連鎖 → 3語連鎖 → 助詞：〈S-S法〉飯塚ら 1998、村尾 2022。Wiki GR-31・GR-35）:
#   1 = 2語（だれが＋どうする／なにを＋どうする）。助詞なし
#   2 = 3語（だれが＋なにを＋どうする）。助詞なし。語の組み合わせが意味で決まる非可逆文
#       または どんな＋なにを＋どうする（〈S-S法〉の2語連鎖の型「属性＋事物」を文の中に入れたもの。型ごとの通過年齢は未確認：GR-31。改善記録 §3）
#   3 = 「どこで」「なにで」「どこに」を加えた3〜4語。助詞（が・で・を・に）を枠のあとに印刷しておく
#       （どこに は〈S-S法〉の課題に「に」があることに合わせた追加。「に」の習得の順序の根拠は未確認）
#   4 = 「いつ」「だれと」を加えた4〜5語の文（1問2文）。助詞（と を含む）を印刷（2026-10-27 追加。改善記録 §7）
#   5 = 「〜て、〜」で2つの動作をつなぐ文（1問2文）。「〜て」の動詞は役割 どうして（ラベルは「どうする」、あとに「、」を印刷）
#       （幼児期の複文は「て」による連鎖が中心：Wiki GR-25。改善記録 §7）
# どんな＝平行四辺形・どこに＝破線の角丸。どんな の形は Shape Coding の原典になく、このプリントで決めたもの。
# 語の組み合わせは、できるだけ意味の上で1つに決まるようにする。ほかの組み合わせでも自然な文になっていれば正答とし、
# 解答面は「こたえの例」とする。
