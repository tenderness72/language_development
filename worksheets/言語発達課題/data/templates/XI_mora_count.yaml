# Ⅺ おとのかず（音韻意識：モーラの分解）
# ことばを声に出して言いながら、音の数だけ○をぬる（シールをはってもよい）。
# 1ページ＝問題1・問題2。1問＝4語（words）。○は7つ並べ、音の数だけぬる。解答面では音の数だけ○を黒くする。
# かなが読める子は文字を数えても解けるので、必ず声に出して（手をたたきながら）数えるように使う（README）。
# level（モーラの分解の発達：天野 1970、原 2012。特殊拍：伊藤・辰巳 1997、高橋 1996。Wiki PA-01・PA-03・PA-05）:
#   1 = 清音・直音だけの語（2〜4音）。二重母音（すいか の い 等。伊藤・辰巳 1997 では特殊拍として調べている：PA-03）も避ける
#   2 = 濁音・半濁音を含む語（2〜5音）。「が」「ぱ」も1つの音であることを確かめる。特殊音節は使わない
#   3 = 撥音・長音（ん・のばす音）を含む語。っ・小さい ゃゅょ は使わない
#   4 = 促音・拗音（っ・小さい ゃゅょ）を含む語。各問に拗音の語と促音の語を入れる
#   （2026-11-05：旧 Lv3 を2段に分けた。撥音・長音は4〜5歳、促音は5歳以降にモーラ単位で分けられるようになる：PA-05。
#    拗音の語を入れるのは、文字を数えると多く数えてしまうので、音で数えているかが分かるため。改善記録 §12）
# 音の数は gen/templates/t7_mora.py の split_mora（小さい ゃゅょ は前の字と1つ、っ・ん・ー は1つ）で数える。
