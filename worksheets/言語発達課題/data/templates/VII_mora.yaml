# Ⅶ 語頭音＋モーラ数
# initial: 語頭音（拗音の語頭音は「しゃ」のように2文字で1マス）
# moras: その問題で出すマスの音数（省略時 [2, 3, 4, 5]）
# fixed: あらかじめマスに書いておく特殊音節 {音数: {マスの位置(0=語頭): 字}}
# answers: 音数ごとの語例（解答面用。fixed のある行は、その字を含む語にする）
# 1ページ＝問題1・問題2。
# level（特殊音節で段階化。伊藤・辰巳 1997、浜田・宇野 2021、村井・中尾 2010 を参考）:
#   1 = 直音の語だけ。マスは2〜4音
#   2 = 撥音（ん）・長音を含む語。1行に「ん」または長音の字を書いておく。促音・拗音の語は使わない
#   3 = 拗音・促音を含む語。語頭音が拗音、または1行に「っ」を書いておく
type: VII
