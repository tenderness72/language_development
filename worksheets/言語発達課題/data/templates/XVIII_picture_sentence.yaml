# ⅩⅧ 絵を見て文を作ろう（絵だけを手がかりに文を作る。2026-10-27 追加。改善記録 §8）
# 語は1つも印刷しない。枠の形とラベル（ⅩⅤ と同じ）と助詞だけを印刷し、絵から語を思い出して書く。
# 参考：関西発達臨床研究会の課題（絵＋「〔　〕が〔　〕を〔　〕」の枠）。ⅩⅤ の言葉箱なし版より手がかりが少ない。
# image: 絵のファイル名（data/images/ に置く。PNG・JPG）。ない間は枠だけを印刷する。
# scene: 絵に描くこと（絵を用意するときの指示。解答面にも書く）。
# sentence: こたえの例（[役割, 語] を文の順に）。絵に合う自然な文なら正答とする。
# 絵の選び方：人や動物は1つ、動作がはっきり分かる場面、余計な物を描かない（文が1つに決まりやすくする）。
#   人は「男の子」「女の子」「お母さん」のように絵から分かる言い方にする（「弟」「友達」は絵では決まらない）。
# level（ⅩⅤ と同じ語の数の段階：2語連鎖 → 3語連鎖 → 場所・道具を加える。Wiki GR-31）:
#   1 = 2語（だれが＋どうする／なにを＋どうする）
#   2 = 3語（だれが＋なにを＋どうする）
#   3 = どこで・なにで・どこに を含む3〜4語
type: XVIII
