# 漢字表記辞書（2026-10-26）。データでひらがなで書いた語を、プリントでは漢字＋ルビで表示する。
# キー: データ上の表記（ひらがな）／値: 表示する形（漢字《よみ》 形式。送りがなは そのまま）。
# 語がひとつの文字列として描かれるとき（語の箱・楕円・枠など）だけ置きかえる。文の中の一部や、マスに1音ずつ書く字は置きかえない。
# 選び方：常用漢字で、ふだん漢字で書く語。意味が文脈で分かれる語（かえる・かき・かみ・たこ・はし・さく・め・かわ 等）、
#   常用漢字にない字の語（りんご・うさぎ・かに 等）、ふつう かなで書く語（おもちゃ・こたつ 等）は かなのまま。
# 音韻意識の課題（Ⅺ〜ⅩⅣ・ⅩⅦ）でも、語は漢字＋ルビで示す（音の数・音の位置は データのかなで数える）。
