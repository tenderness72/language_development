# プリントの構成。
#   python generate.py --catalog
# で、ここに並べた順に番号を付けて プリント/ に作り直す（毎回、古い出力は消して作り直す）。
#   プリント/01_連想チェーン/Lv1/01_連想チェーン_Lv1_問題.pdf（＋ _解答.pdf）
# 各レベルの PDF には、そのレベルの問題を1回ずつ収める（1枚2問。奇数のときは1問あまる）。
# name はフォルダ名・ファイル名に使う（記号は使わない）。
# variants: 同じ問題を別の形でも作る（suffix がファイル名の末尾に付く。set の値で全問を上書き。only: キー名 を書くと、そのキーを持つ問題だけで作る）。
# 番号は課題の通し番号で、取り組む順ではない。取り組む順は README の「はじめる順」を参照。
catalog:
  - { type: I,    name: 連想チェーン }
  - { type: II,   name: 意味ネットワーク照合 }
  - { type: III,  name: ペア対応づけ }
  - { type: IV,   name: 放射状連想 }
  - { type: V,    name: つづき歌 }
  - { type: VI,   name: カテゴリー流暢性, variants: [ { suffix: 5行, set: { lines: 5 } }, { suffix: 頭の文字ヒント, set: { show_hints: true }, only: hints } ] }   # ヒント版は Ⅸ と同じカテゴリーだけ（README「選ぶ → 書く」）
  - { type: VII,  name: 語頭音とモーラ数 }
  - { type: VIII, name: 属性交差ベン図 }
  # 書かない版（○や線で答える）。書字が育ちきっていない子でも、意味の力を取り出して見られる。
  - { type: IX,   name: 仲間えらび }        # Ⅵ の書かない版
  - { type: X,    name: ベン図えらび }      # Ⅷ の書かない版
  # 音韻意識（声に出して言いながら・手をたたきながら使う。文字を数えて解かせない）
  - { type: XI,   name: おとのかず }        # 音の数だけ○をぬる（シールでもよい）
  - { type: XII,  name: おとさがし }        # はじめ・おしまい・どこかの音
  - { type: XIII, name: おとけしとぎゃくよみ }  # 音の削除・逆唱
  - { type: XIV,  name: おとからことばあつめ }  # 「〇から始まる言葉」「〇で終わる言葉」を自由に書く
  # 構文（二語文・三語文）
  - { type: XV,   name: ぶんをつくろう, variants: [ { suffix: 助詞を書く, set: { particle_blank: true } }, { suffix: 言葉箱なし, set: { no_bank: true } } ] }    # 語を役割の枠にならべる（2語 → 3語 → どこで・なにで）。助詞を自分で書く版、言葉箱なし（どうするだけ印刷・ほかは自分で出す）版も作る
  - { type: XVI,  name: じょしをいれよう }  # 格助詞が・を（1つ → 2つ → 可逆文・語順の入れかえ）
  # 音韻操作（追加）。番号を変えないよう末尾に置く
  - { type: XVII, name: ことばへんしん }    # 指示どおりに音を変えて別のことばにする（2→2・2→3・2→4音）
  # 構文（追加）。絵だけを手がかりに文を作る（ⅩⅤ の言葉箱なし版より手がかりが少ない）
  - { type: XVIII, name: えをみてぶんをつくろう }   # 絵は data/images/ に置く（ないときは枠だけ）
